name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Verify Windows SVG icon generator without overwriting production assets
        shell: pwsh
        run: |
          $generated = Join-Path $env:RUNNER_TEMP 'dejavu-generated-brand-icons'
          pwsh -NoProfile -STA -File ./tools/GenerateIcon.ps1 -IconOutputPath (Join-Path $generated 'dejavu.ico')
          if ($LASTEXITCODE -ne 0) { throw 'Windows SVG icon generation failed.' }
          dotnet run --project tools/WindowsReleaseProbe/WindowsReleaseProbe.csproj -c Release -- `
            --source-root "${{ github.workspace }}" --generated-assets $generated `
            --output (Join-Path $env:RUNNER_TEMP 'dejavu-generated-brand-evidence')
          if ($LASTEXITCODE -ne 0) { throw 'Windows-generated SVG/ICO provenance or palette validation failed.' }
      - name: Build Windows app
        run: dotnet build ClaudeUsageTray.csproj -c Release
      - name: Validate XAML
        shell: pwsh
        run: |
          Get-ChildItem -File -Filter *.xaml | ForEach-Object {
            [xml](Get-Content -LiteralPath $_.FullName -Raw) | Out-Null
          }
      - name: Verify widget layout matrix
        env:
          DEJAVU_THEME_REGRESSION_PREVIEW: ${{ runner.temp }}/dejavu-wpf-theme-preview
        run: dotnet run --project tools/WidgetLayoutProbe/WidgetLayoutProbe.csproj -c Release
      - name: Save synthetic native WPF previews
        uses: actions/upload-artifact@v6
        with:
          name: windows-theme-previews
          path: ${{ runner.temp }}/dejavu-wpf-theme-preview/*.png
          if-no-files-found: error
          retention-days: 7
      - name: Verify Settings redesign matrix
        shell: pwsh
        run: |
          $env:DEJAVU_SETTINGS_ONLY = '1'
          try {
            dotnet run --project tools/WidgetLayoutProbe/WidgetLayoutProbe.csproj -c Release
            if ($LASTEXITCODE -ne 0) { throw "Settings redesign validation failed." }
          } finally {
            Remove-Item Env:DEJAVU_SETTINGS_ONLY
          }
      - name: Verify Claude usage parser
        run: dotnet run --project tools/ClaudeUsageParserProbe/ClaudeUsageParserProbe.csproj -c Release
      - name: Verify provider parsing and Codex cancellation
        run: dotnet run --project tools/WindowsProviderProbe/WindowsProviderProbe.csproj -c Release
      - name: Install Windows packaging tools
        run: dotnet tool install --global vpk --version 1.2.0
      - name: Build actual Windows release candidate
        shell: pwsh
        run: |
          $outputRoot = Join-Path $env:RUNNER_TEMP 'dejavu-release-candidate'
          ./tools/BuildRelease.ps1 -OutputRoot $outputRoot
      - name: Verify actual Windows installation and Start Menu logo
        shell: pwsh
        run: |
          $version = ([xml](Get-Content ./ClaudeUsageTray.csproj -Raw)).Project.PropertyGroup.Version
          ./tools/TestWindowsRelease.ps1 `
            -ReleaseDirectory (Join-Path $env:RUNNER_TEMP 'dejavu-release-candidate/dejavu-velopack-releases') `
            -OutputDirectory (Join-Path $env:RUNNER_TEMP 'dejavu-installed-evidence') `
            -Version $version
      - name: Save actual Windows package and installed logo evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-release-acceptance
          path: |
            ${{ runner.temp }}/dejavu-generated-brand-evidence/
            ${{ runner.temp }}/dejavu-release-candidate/windows-icon-verification/
            ${{ runner.temp }}/dejavu-installed-evidence/
          if-no-files-found: error
          retention-days: 7
      - name: Save verified Windows release candidate
        uses: actions/upload-artifact@v6
        with:
          name: windows-release-candidate
          path: ${{ runner.temp }}/dejavu-release-candidate/dejavu-velopack-releases/*
          if-no-files-found: error
          retention-days: 7

  macos:
    runs-on: macos-latest
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: Test macOS core package
        run: swift test --package-path macos/Packages/DejavuKit --scratch-path "${RUNNER_TEMP}/dejavu-package" -Xswiftc -warnings-as-errors
      - name: Verify actual macOS AppModel and update coordinator
        run: |
          bash tools/RunMacAppModelProbe.sh "${RUNNER_TEMP}/dejavu-package"
          bash tools/RunMacUpdateProbe.sh "${RUNNER_TEMP}/dejavu-package"
      - name: Build macOS core package in Release
        run: swift build -c release --package-path macos/Packages/DejavuKit -Xswiftc -warnings-as-errors
      - name: Build native macOS app
        run: >-
          xcodebuild
          -project macos/DejavuMac.xcodeproj
          -scheme DejavuMac
          -configuration Release
          -destination 'platform=macOS'
          -derivedDataPath /tmp/dejavu-mac-derived
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Verify native macOS UI without provider access
        run: |
          app=/tmp/dejavu-mac-derived/Build/Products/Release/Dejavu.app
          codesign --force --deep --sign - --timestamp=none "$app"
          codesign --verify --deep --strict "$app"
          "$app/Contents/MacOS/Dejavu" --validate-ui
      - name: Build Claude status-line bridge
        run: >-
          xcodebuild
          -project macos/DejavuMac.xcodeproj
          -scheme DejavuClaudeBridge
          -configuration Release
          -destination 'platform=macOS'
          -derivedDataPath /tmp/dejavu-bridge-derived
          CODE_SIGNING_ALLOWED=NO
          build

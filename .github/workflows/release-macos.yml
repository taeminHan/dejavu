name: Build macOS release

on:
  workflow_dispatch:
    inputs:
      publish_to_release:
        description: Upload verified assets to the GitHub release matching the Windows project version
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release-macos:
    runs-on: macos-latest
    environment: macos-release
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
      SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
      SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
      OUTPUT_ROOT: ${{ github.workspace }}/outputs/dejavu-macos-release
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read Windows project version
        id: version
        shell: bash
        run: |
          version="$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' ClaudeUsageTray.csproj | head -1)"
          build_number="$(git rev-list --count HEAD)"
          test -n "${version}"
          test "${build_number}" -gt 0
          printf 'VERSION=%s\n' "${version}" >> "${GITHUB_ENV}"
          printf 'BUILD_NUMBER=%s\n' "${build_number}" >> "${GITHUB_ENV}"
          printf 'value=%s\n' "${version}" >> "${GITHUB_OUTPUT}"

      - name: Validate source
        run: |
          swift test --package-path macos/Packages/DejavuKit -Xswiftc -warnings-as-errors
          plutil -lint macos/DejavuMac/Config/Info.plist
          plutil -lint macos/DejavuUsageWidget/Config/Info.plist
          git diff --check

      - name: Import Developer ID identity
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          keychain_path="${RUNNER_TEMP}/dejavu-signing.keychain-db"
          certificate_path="${RUNNER_TEMP}/developer-id.p12"
          printf '%s' "${DEVELOPER_ID_P12_BASE64}" | base64 --decode > "${certificate_path}"
          security create-keychain -p "${RUNNER_TEMP}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${RUNNER_TEMP}" "${keychain_path}"
          security import "${certificate_path}" -P "${DEVELOPER_ID_P12_PASSWORD}" -A -t cert -f pkcs12 -k "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${RUNNER_TEMP}" "${keychain_path}"

      - name: Prepare App Store Connect API key
        env:
          APPLE_NOTARY_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY_BASE64 }}
        run: |
          notary_key_path="${RUNNER_TEMP}/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          printf '%s' "${APPLE_NOTARY_PRIVATE_KEY_BASE64}" | base64 --decode > "${notary_key_path}"
          chmod 600 "${notary_key_path}"
          echo "APPLE_NOTARY_KEY_PATH=${notary_key_path}" >> "${GITHUB_ENV}"

      - name: Build, sign, notarize, and generate appcast
        run: ./tools/BuildMacRelease.sh

      - name: Upload verified workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: Dejavu-macOS-${{ steps.version.outputs.value }}
          path: |
            ${{ github.workspace }}/outputs/dejavu-macos-release/Dejavu-macOS-arm64.dmg
            ${{ github.workspace }}/outputs/dejavu-macos-release/Dejavu-macOS-arm64.zip
            ${{ github.workspace }}/outputs/dejavu-macos-release/appcast-macos.xml
            ${{ github.workspace }}/outputs/dejavu-macos-release/SHA256SUMS-macOS.txt
          if-no-files-found: error

      - name: Upload to GitHub release
        if: inputs.publish_to_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${VERSION}" \
            "${OUTPUT_ROOT}/Dejavu-macOS-arm64.dmg" \
            "${OUTPUT_ROOT}/Dejavu-macOS-arm64.zip" \
            "${OUTPUT_ROOT}/appcast-macos.xml" \
            "${OUTPUT_ROOT}/SHA256SUMS-macOS.txt" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber

name: Release dejavu

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos-free:
    runs-on: macos-latest
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      OUTPUT_ROOT: ${{ github.workspace }}/outputs/dejavu-macos-free-release
      SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read and verify shared release version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          project_version="$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' ClaudeUsageTray.csproj | head -1)"
          build_number="$(git rev-list --count HEAD)"
          test -n "${version}"
          test "${version}" = "${project_version}"
          test "${build_number}" -gt 0
          printf 'VERSION=%s\n' "${version}" >> "${GITHUB_ENV}"
          printf 'BUILD_NUMBER=%s\n' "${build_number}" >> "${GITHUB_ENV}"

      - name: Verify Sparkle signing secret
        shell: bash
        run: test -n "${SPARKLE_ED_PRIVATE_KEY}"

      - name: Test macOS package
        run: swift test --package-path macos/Packages/DejavuKit --scratch-path "${RUNNER_TEMP}/dejavu-package" -Xswiftc -warnings-as-errors

      - name: Verify actual macOS AppModel and update coordinator
        run: |
          bash tools/RunMacAppModelProbe.sh "${RUNNER_TEMP}/dejavu-package"
          bash tools/RunMacUpdateProbe.sh "${RUNNER_TEMP}/dejavu-package"

      - name: Build ad-hoc macOS release and signed update feed
        run: ./tools/BuildMacFreeRelease.sh

      - name: Verify macOS release artifacts
        shell: bash
        run: |
          (cd "${OUTPUT_ROOT}" && shasum -a 256 -c SHA256SUMS-macOS.txt)
          unzip -q "${OUTPUT_ROOT}/Dejavu-macOS-arm64.zip" -d "${RUNNER_TEMP}/dejavu-macos-verify"
          codesign --verify --deep --strict --verbose=2 "${RUNNER_TEMP}/dejavu-macos-verify/Dejavu.app"
          file "${RUNNER_TEMP}/dejavu-macos-verify/Dejavu.app/Contents/MacOS/Dejavu" | grep -q arm64
          test -x "${RUNNER_TEMP}/dejavu-macos-verify/Dejavu.app/Contents/Helpers/dejavu-claude-bridge"
          test -d "${RUNNER_TEMP}/dejavu-macos-verify/Dejavu.app/Contents/PlugIns/DejavuUsageWidget.appex"
          test "$(plutil -extract CFBundleShortVersionString raw "${RUNNER_TEMP}/dejavu-macos-verify/Dejavu.app/Contents/Info.plist")" = "${VERSION}"
          test "$(plutil -extract CFBundleVersion raw "${RUNNER_TEMP}/dejavu-macos-verify/Dejavu.app/Contents/Info.plist")" = "${BUILD_NUMBER}"
          test "$(plutil -extract SUPublicEDKey raw "${RUNNER_TEMP}/dejavu-macos-verify/Dejavu.app/Contents/Info.plist")" = "bCWiRQh8qw0hCNQBihOz/OSg1GJYymWoGTxvm7k2WLg="
          grep -q "<sparkle:version>${BUILD_NUMBER}</sparkle:version>" "${OUTPUT_ROOT}/appcast-macos.xml"
          grep -q "<sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>" "${OUTPUT_ROOT}/appcast-macos.xml"
          grep -q 'sparkle:edSignature=' "${OUTPUT_ROOT}/appcast-macos.xml"
          xmllint --noout "${OUTPUT_ROOT}/appcast-macos.xml"
          "${RUNNER_TEMP}/dejavu-macos-verify/Dejavu.app/Contents/MacOS/Dejavu" --validate-ui

      - name: Upload verified macOS assets
        uses: actions/upload-artifact@v6
        with:
          name: dejavu-macos-release-assets
          path: |
            ${{ github.workspace }}/outputs/dejavu-macos-free-release/Dejavu-macOS-arm64.dmg
            ${{ github.workspace }}/outputs/dejavu-macos-free-release/Dejavu-macOS-arm64.zip
            ${{ github.workspace }}/outputs/dejavu-macos-free-release/appcast-macos.xml
            ${{ github.workspace }}/outputs/dejavu-macos-free-release/SHA256SUMS-macOS.txt
          if-no-files-found: error

  release:
    needs: build-macos-free
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.401"

      - name: Verify release source
        shell: pwsh
        run: |
          $generated = Join-Path $env:RUNNER_TEMP 'dejavu-generated-brand-icons'
          pwsh -NoProfile -STA -File ./tools/GenerateIcon.ps1 -IconOutputPath (Join-Path $generated 'dejavu.ico')
          if ($LASTEXITCODE -ne 0) { throw 'Windows SVG icon generation failed.' }
          dotnet run --project tools/WindowsReleaseProbe/WindowsReleaseProbe.csproj -c Release -- `
            --source-root "${{ github.workspace }}" --generated-assets $generated `
            --output (Join-Path $env:RUNNER_TEMP 'dejavu-generated-brand-evidence')
          if ($LASTEXITCODE -ne 0) { throw 'Windows-generated SVG/ICO provenance or palette validation failed.' }
          Get-ChildItem -File -Filter *.xaml | ForEach-Object {
            [xml](Get-Content -LiteralPath $_.FullName -Raw) | Out-Null
          }
          dotnet build ClaudeUsageTray.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "Release build validation failed." }
          dotnet run --project tools/WidgetLayoutProbe/WidgetLayoutProbe.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "WPF layout validation failed." }
          $env:DEJAVU_SETTINGS_ONLY = '1'
          try {
            dotnet run --project tools/WidgetLayoutProbe/WidgetLayoutProbe.csproj -c Release
            if ($LASTEXITCODE -ne 0) { throw "Settings redesign validation failed." }
          } finally {
            Remove-Item Env:DEJAVU_SETTINGS_ONLY
          }
          dotnet run --project tools/ClaudeUsageParserProbe/ClaudeUsageParserProbe.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "Claude usage parser validation failed." }
          dotnet run --project tools/WindowsProviderProbe/WindowsProviderProbe.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "Provider parsing/cancellation validation failed." }

      - name: Install Velopack CLI
        run: dotnet tool install --global vpk --version 1.2.0

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          "value=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$($version.Contains('-').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Prepare release paths
        id: paths
        shell: pwsh
        run: |
          $outputRoot = Join-Path $env:RUNNER_TEMP "dejavu-output"
          "output_root=$outputRoot" >> $env:GITHUB_OUTPUT
          "release_dir=$(Join-Path $outputRoot 'dejavu-velopack-releases')" >> $env:GITHUB_OUTPUT

      - name: Download previous Velopack release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ("${{ steps.version.outputs.value }}" -eq '0.9.7') {
            ./tools/InitializeWindowsReleaseBaseline.ps1 `
              -ReleaseDirectory "${{ steps.paths.outputs.release_dir }}" `
              -CacheDirectory (Join-Path $env:RUNNER_TEMP 'dejavu-pinned-delta-baseline')
          } else {
            vpk download github `
              --repoUrl "https://github.com/${{ github.repository }}" `
              --token "${{ secrets.GITHUB_TOKEN }}" `
              --outputDir "${{ steps.paths.outputs.release_dir }}" `
              --channel win `
              --pre "${{ steps.version.outputs.prerelease }}"
            if ($LASTEXITCODE -ne 0) {
              Write-Warning 'Previous release unavailable; a full-only package will be created.'
              exit 0
            }
          }

      - name: Build Velopack release
        shell: pwsh
        run: ./tools/BuildRelease.ps1 -Version "${{ steps.version.outputs.value }}" -OutputRoot "${{ steps.paths.outputs.output_root }}" -RemovePinnedBaseline:("${{ steps.version.outputs.value }}" -eq '0.9.7')

      - name: Verify actual Windows installation and Start Menu logo
        shell: pwsh
        run: |
          ./tools/TestWindowsRelease.ps1 `
            -ReleaseDirectory "${{ steps.paths.outputs.release_dir }}" `
            -OutputDirectory (Join-Path $env:RUNNER_TEMP 'dejavu-installed-evidence') `
            -Version "${{ steps.version.outputs.value }}"

      - name: Save actual packaged and installed Windows acceptance evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-release-acceptance
          path: |
            ${{ runner.temp }}/dejavu-generated-brand-evidence/
            ${{ steps.paths.outputs.output_root }}/windows-icon-verification/
            ${{ runner.temp }}/dejavu-installed-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Create draft GitHub release
        shell: pwsh
        run: |
          vpk upload github `
            --repoUrl "https://github.com/${{ github.repository }}" `
            --token "${{ secrets.GITHUB_TOKEN }}" `
            --outputDir "${{ steps.paths.outputs.release_dir }}" `
            --channel win `
            --tag "${{ github.ref_name }}" `
            --releaseName "dejavu ${{ github.ref_name }}" `
            --targetCommitish "${{ github.sha }}" `
            --pre "${{ steps.version.outputs.prerelease }}" `
            --publish false
          if ($LASTEXITCODE -ne 0) { throw "The draft release could not be created." }

      - name: Attach installed Windows acceptance evidence to draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'dejavu-installed-evidence'
          $archive = Join-Path $env:RUNNER_TEMP 'Windows-release-verification.zip'
          Compress-Archive -Path (Join-Path $evidence '*') -DestinationPath $archive
          gh release upload "${{ github.ref_name }}" $archive `
            --repo "${{ github.repository }}" --clobber
          if ($LASTEXITCODE -ne 0) { throw "Installed acceptance evidence could not be attached to the draft." }

      - name: Upload stable download alias
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" `
            "${{ steps.paths.outputs.release_dir }}\dejavu-Setup.exe" `
            --repo "${{ github.repository }}" `
            --clobber
          if ($LASTEXITCODE -ne 0) { throw "The stable setup alias could not be uploaded." }

      - name: Download verified macOS assets
        uses: actions/download-artifact@v7
        with:
          name: dejavu-macos-release-assets
          path: ${{ runner.temp }}/dejavu-macos-release-assets

      - name: Upload macOS release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $macAssets = Join-Path $env:RUNNER_TEMP "dejavu-macos-release-assets"
          gh release upload "${{ github.ref_name }}" `
            (Join-Path $macAssets "Dejavu-macOS-arm64.dmg") `
            (Join-Path $macAssets "Dejavu-macOS-arm64.zip") `
            (Join-Path $macAssets "appcast-macos.xml") `
            (Join-Path $macAssets "SHA256SUMS-macOS.txt") `
            --repo "${{ github.repository }}" `
            --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Verified macOS assets could not be uploaded."
          }

      - name: Generate checksums from uploaded release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $publishedDir = Join-Path $env:RUNNER_TEMP "dejavu-published-assets"
          New-Item -ItemType Directory -Path $publishedDir -Force | Out-Null
          gh release download "${{ github.ref_name }}" `
            --repo "${{ github.repository }}" `
            --dir $publishedDir
          if ($LASTEXITCODE -ne 0) {
            throw "Published release assets could not be downloaded."
          }

          # Validate the files downloaded back from the draft, not only local output.
          dotnet run --project tools/WindowsReleaseProbe/WindowsReleaseProbe.csproj -c Release -- `
            --source-root "${{ github.workspace }}" --release-dir $publishedDir `
            --version "${{ steps.version.outputs.value }}" `
            --output (Join-Path $env:RUNNER_TEMP 'dejavu-uploaded-icon-verification')
          if ($LASTEXITCODE -ne 0) { throw "Uploaded Windows artifacts failed icon acceptance." }
          $requiredWindowsAssets = @(
            "dejavu-desktop-${{ steps.version.outputs.value }}-full.nupkg",
            'dejavu-desktop-win-Portable.zip', 'dejavu-desktop-win-Setup.exe',
            'dejavu-Setup.exe', 'RELEASES', 'releases.win.json')
          $deltaName = "dejavu-desktop-${{ steps.version.outputs.value }}-delta.nupkg"
          if (Test-Path -LiteralPath (Join-Path "${{ steps.paths.outputs.release_dir }}" $deltaName)) {
            $requiredWindowsAssets += $deltaName
          }
          foreach ($name in $requiredWindowsAssets) {
            $built = Join-Path "${{ steps.paths.outputs.release_dir }}" $name
            $uploaded = Join-Path $publishedDir $name
            if ((Get-FileHash -LiteralPath $built -Algorithm SHA256).Hash -ne
                (Get-FileHash -LiteralPath $uploaded -Algorithm SHA256).Hash) {
              throw "An uploaded Windows artifact differs from the package that passed installation: $name"
            }
          }

          $checksumsPath = Join-Path $publishedDir "SHA256SUMS.txt"
          if (Test-Path -LiteralPath $checksumsPath) {
            Remove-Item -LiteralPath $checksumsPath -Force
          }
          $publishedAssets = Get-ChildItem -LiteralPath $publishedDir -File | Sort-Object Name
          if (-not $publishedAssets) {
            throw "The published release contains no assets."
          }
          $checksumLines = foreach ($artifact in $publishedAssets) {
            $hash = (Get-FileHash -LiteralPath $artifact.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($artifact.Name)"
          }
          $checksumText = ($checksumLines -join "`n") + "`n"
          [System.IO.File]::WriteAllText(
            $checksumsPath,
            $checksumText,
            [System.Text.UTF8Encoding]::new($false))
          gh release upload "${{ github.ref_name }}" $checksumsPath `
            --repo "${{ github.repository }}" `
            --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Published checksums could not be uploaded."
          }

          $versionedSetup = Get-ChildItem -LiteralPath $publishedDir -File `
            -Filter "dejavu-desktop-win-Setup.exe" | Select-Object -First 1
          $stableSetup = Get-Item -LiteralPath (Join-Path $publishedDir "dejavu-Setup.exe")
          if (-not $versionedSetup -or
              (Get-FileHash -LiteralPath $versionedSetup.FullName -Algorithm SHA256).Hash -ne
              (Get-FileHash -LiteralPath $stableSetup.FullName -Algorithm SHA256).Hash) {
            throw "The stable setup alias does not match the versioned setup."
          }

      - name: Verify uploaded checksum asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $publishedDir = Join-Path $env:RUNNER_TEMP "dejavu-published-assets"
          $verificationDir = Join-Path $env:RUNNER_TEMP "dejavu-checksum-verification"
          New-Item -ItemType Directory -Path $verificationDir -Force | Out-Null
          gh release download "${{ github.ref_name }}" `
            --repo "${{ github.repository }}" `
            --pattern "SHA256SUMS.txt" `
            --dir $verificationDir
          if ($LASTEXITCODE -ne 0) {
            throw "The published checksum asset could not be downloaded."
          }
          $localChecksum = Join-Path $publishedDir "SHA256SUMS.txt"
          $publishedChecksum = Join-Path $verificationDir "SHA256SUMS.txt"
          if ((Get-FileHash -LiteralPath $localChecksum -Algorithm SHA256).Hash -ne
              (Get-FileHash -LiteralPath $publishedChecksum -Algorithm SHA256).Hash) {
            throw "The published checksum file differs from the verified local copy."
          }

      - name: Keep verified release draft for final artifact and visual review
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $draft = gh release view "${{ github.ref_name }}" `
            --repo "${{ github.repository }}" --json isDraft --jq '.isDraft'
          if ($LASTEXITCODE -ne 0) {
            throw "The verified draft release could not be inspected."
          }
          if ($draft -ne 'true') { throw "Release was exposed before final artifact review." }
          Write-Host 'Verified assets and installation evidence are ready in a DRAFT release.'
          Write-Host 'Publication requires explicit final review of the downloaded files and native PNG evidence.'

  windows-upgrade:
    needs: release
    runs-on: windows-latest
    steps:
      - name: Check out exact tagged source
        uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.401"
      - name: Download actual draft release files for isolated upgrade acceptance
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $draft = gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" --json isDraft --jq '.isDraft'
          if ($LASTEXITCODE -ne 0 -or $draft -ne 'true') { throw 'Upgrade acceptance requires an unpublished draft.' }
          $candidate = Join-Path $env:RUNNER_TEMP 'dejavu-upgrade-candidate'
          New-Item -ItemType Directory -Path $candidate | Out-Null
          gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" --dir $candidate
          if ($LASTEXITCODE -ne 0) { throw 'The actual draft release assets could not be downloaded.' }
      - name: Verify actual uploaded package upgrades the public 0.9.6 installation
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./tools/TestWindowsUpgrade.ps1 `
            -ReleaseDirectory (Join-Path $env:RUNNER_TEMP 'dejavu-upgrade-candidate') `
            -OutputDirectory (Join-Path $env:RUNNER_TEMP 'dejavu-upgrade-evidence') `
            -Version ("${{ github.ref_name }}".TrimStart('v'))
      - name: Save actual draft package upgrade evidence before publication
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-upgrade-acceptance
          path: ${{ runner.temp }}/dejavu-upgrade-evidence/
          if-no-files-found: error
          retention-days: 30

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build Windows app
        run: dotnet build ClaudeUsageTray.csproj -c Release
      - name: Verify widget layout matrix
        run: dotnet run --project tools/WidgetLayoutProbe/WidgetLayoutProbe.csproj -c Release

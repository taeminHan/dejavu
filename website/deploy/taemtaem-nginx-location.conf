# Add these locations before the existing `location /` block in the
# taemtaem.dev HTTPS server. The dejavu-site container must share the same
# Docker network as the reverse-proxy container.

location = /dejavu {
    return 308 /dejavu/;
}

location /dejavu/ {
    # No trailing slash: preserve the original /dejavu/... request path.
    proxy_pass http://dejavu-site:8080;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
